name: Build zips for itch.io

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zip

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja zip

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake ninja zip
        shell: powershell

      - name: Clone + bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
        shell: bash

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat
        shell: powershell

      - name: Bootstrap vcpkg (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Install SFML via vcpkg
        run: ./vcpkg/vcpkg install sfml
        shell: bash

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Install to dist
        run: cmake --install build --prefix dist

      - name: Zip (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r ../KeyboardHero-${{ runner.os }}.zip .
          cd ..

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ..\KeyboardHero-Windows.zip"
          cd ..
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardHero-${{ runner.os }}
          path: KeyboardHero-*.zip
