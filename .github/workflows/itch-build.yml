name: Build zips for itch.io

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------
      # OS tools + system deps (needed for SFML build on Linux)
      # ----------------------
      - name: Install tools + deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ zip \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev

      - name: Install tools + deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja zip
          # Optional; only needed if you later hit X11-related SFML build issues on macOS
          # brew install --cask xquartz

      - name: Install tools + deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake ninja zip
        shell: powershell

      # ----------------------
      # vcpkg (clone + bootstrap) + SFML
      # ----------------------
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git vcpkg
        shell: bash

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat
        shell: powershell

      - name: Bootstrap vcpkg (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Install SFML via vcpkg
        run: ./vcpkg/vcpkg install sfml
        shell: bash

      # ----------------------
      # Configure / Build / Install (into dist/)
      # ----------------------
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        shell: bash

      - name: Build
        run: cmake --build build
        shell: bash

      - name: Install to dist
        run: cmake --install build --prefix dist
        shell: bash

      # ----------------------
      # Bundle runtime libs into dist/
      # ----------------------
      - name: Bundle runtime libs (Windows)
        if: runner.os == 'Windows'
        run: |
          # Copy SFML DLLs (and other runtime deps) next to the exe
          Copy-Item -Force -ErrorAction SilentlyContinue "vcpkg\installed\x64-windows\bin\*.dll" "dist\"
          Copy-Item -Force -ErrorAction SilentlyContinue "vcpkg\installed\x64-windows\debug\bin\*.dll" "dist\"
        shell: powershell

      - name: Bundle runtime libs (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euxo pipefail
          # Copy shared libs next to the executable (safe if none match)
          cp -av vcpkg/installed/*/lib/*.so* dist/ 2>/dev/null || true
          cp -av vcpkg/installed/*/lib/*.dylib dist/ 2>/dev/null || true
        shell: bash

      # ----------------------
      # Zip + upload artifacts
      # ----------------------
      - name: Zip (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r ../KeyboardHero-${{ runner.os }}.zip .
          cd ..
        shell: bash

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ..\KeyboardHero-Windows.zip"
          cd ..
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardHero-${{ runner.os }}
          path: KeyboardHero-*.zip
